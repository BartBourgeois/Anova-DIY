site_name: Anova-DIY
site_url: https://cooked.raptox.be/
site_description: Reverse engineering and recovery of an Anova Precision Cooker Pro (AN600) that died after an interrupted OTA firmware update
repo_url: https://github.com/BartBourgeois/Anova-DIY
repo_name: GitHub
edit_uri: ""
docs_dir: site-src
site_dir: site
strict: false

extra:
  # Shown in the status strip on every page and in the home-page hero (web/overrides/main.html). Keep it current.
  status: "It cooks again · dead on 29 Oct, cooking since 6 Nov 2026 · the locked Wi-Fi chip reprogrammed"
  # steady: the status LED stops blinking (the cooker works); anything else: it blinks.
  led: steady
  tagline: "A $450 sous-vide cooker, a firmware update that stopped partway, and everything it took to get it cooking again. Any%: whatever number yours froze on, by whatever route works."
  # The finish, shown in the home-page hero while set (web/overrides/main.html). post: the blog post's URL.
  win:
    kicker: "Any% · finished · 9 days"
    headline: "It cooks again"
    line: "Dead on 29 October, after an update stalled at 75 %. Cooking on 6 November, on its original main board."
    post: blog/2026/11/06/it-cooks-again/
    splits:
      - {date: "28 Oct", what: "The update stalls at 75 %"}
      - {date: "29 Oct", what: "Dead: no beep, no display, no lights"}
      - {date: "1 Nov", what: "Head opened, the chips read"}
      - {date: "4 Nov", what: "The power board is fine: 5.01 V"}
      - {date: "6 Nov", what: "Both chips backed up, read twice"}
      - {date: "6 Nov", what: "Found: the Wi-Fi chip had locked itself"}
      - {date: "6 Nov", what: "Reprogrammed, the lock cleared"}
      - {date: "6 Nov", what: "It cooks: 54 °C, on point"}

extra_css:
  - _web/extra.css

theme:
  name: material
  custom_dir: web/overrides
  logo: _web/logo.svg
  favicon: _web/logo.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - toc.follow
  # No media queries: the first entry (dark) is the default for everyone; the toggle switches to light.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode

plugins:
  - search
  - blog:
      blog_dir: blog
      post_url_format: "{date}/{slug}"
      archive: true
      categories: true
      pagination_per_page: 10

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Blog:
      - blog/index.md
  - Roadmap: docs/roadmap.md
  - Timeline: docs/timeline.md
  - Incident:
      - What happened: docs/incident.md
      - Correspondence: docs/correspondence.md
  - Hardware:
      - Overview: docs/hardware/overview.md
      - Main board: docs/hardware/main-board.md
      - Power board: docs/hardware/power-board.md
      - Components: docs/hardware/components.md
      - Nets: docs/hardware/nets.md
      - J8 pinout: docs/hardware/j8.md
      - Test points: docs/hardware/testpoints.md
      - Opening the head: docs/hardware/disassembly.md
      - Bench setup: docs/hardware/bench-setup.md
      - Microscope: docs/microscope.md
      - Callout tables:
          - Main board, component side (mosaic, raptox's unit): docs/hardware/callouts/main_component-side_micro.md
          - Main board, test points (mosaic, raptox's unit): docs/hardware/callouts/main_testpoints_micro.md
          - Main board, recovery access points (mosaic, raptox's unit): docs/hardware/callouts/main_hookup_overview_micro.md
          - J29 serial header, hookup (mosaic, raptox's unit): docs/hardware/callouts/micro_J29_hookup.md
          - U1 / U15 / J14, strap pads and meter points (mosaic, raptox's unit): docs/hardware/callouts/micro_U1_J14_hookup.md
          - JP5 and the J8 end, hookup (mosaic, raptox's unit): docs/hardware/callouts/micro_J8_area_hookup.md
          - CC3220S LaunchPad, top (raptox's board): docs/hardware/callouts/launchpad_top_own.md
          - Main board, component side (raptox's unit): docs/hardware/callouts/main_component-side_own.md
          - Main board, component side (FCC): docs/hardware/callouts/main_component-side.md
          - Main board, LED side (FCC): docs/hardware/callouts/main_led-side.md
          - Power board, top (FCC): docs/hardware/callouts/power_top.md
          - Power board, bottom (FCC): docs/hardware/callouts/power_bottom.md
          - Assembly (FCC): docs/hardware/callouts/assembly_open.md
          - Front bezel (FCC): docs/hardware/callouts/front_bezel.md
  - Recovery:
      - Handbook: docs/recovery/index.md
      - "1 Meter checks": docs/recovery/01-meter-checks.md
      - "3 Boot-loader session": docs/recovery/03-bootloader-session.md
      - "4 Boot listen": docs/recovery/04-boot-listen.md
      - "6 First boot and cook": docs/recovery/06-first-boot-and-cook.md
  - Flash backup:
      - Handbook: docs/flashbackup/index.md
      - "1 The readers": docs/flashbackup/01-readers.md
      - "2 Clip and harness": docs/flashbackup/02-clip-and-harness.md
      - "3 LaunchPad: qualify the clip": docs/flashbackup/03-launchpad-qualify.md
      - "5 LaunchPad: production backup": docs/flashbackup/05-launchpad-backup.md
      - "6 LaunchPad: the files": docs/flashbackup/06-launchpad-files.md
      - "7 Cooker: connect and validate": docs/flashbackup/07-cooker-connect.md
      - "8 Cooker: back up": docs/flashbackup/08-cooker-backup.md
      - "9 Cooker: the flash examined": docs/flashbackup/09-cooker-analysis.md
      - "10 Cooker: the Bluetooth chip": docs/flashbackup/10-cooker-u7.md
  - Firmware:
      - Recovery strategy: docs/firmware/recovery-strategy.md
  - Plan B: docs/plan-b-custom-mainboard.md
  - Photos:
      - Photo log: docs/photos.md
      - Microscope mosaics: docs/mosaics.md
  - References: docs/references.md
  - Legal: docs/legal.md
  - License: LICENSE.md
