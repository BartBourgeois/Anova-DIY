; j8probe: listen-only probe for the cooker's boards. Build on the desk, see README.md.
;   py -3.13 -m platformio run -d tools/j8probe                       # both setups
;   py -3.13 -m platformio run -d tools/j8probe -e j8 -t upload --upload-port COM5

[platformio]
default_envs = j8, aux

[env]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 921600
build_flags = -Wall

[env:j8]
build_flags = ${env.build_flags} -DJ8PROBE_SETUP_J8

[env:aux]
build_flags = ${env.build_flags} -DJ8PROBE_SETUP_AUX -DWITH_RADIO_SCAN=1
