; espserprog: a read-only flashrom serprog reader on a classic ESP32 (3.3 V logic). See README.md.
;   py -3.13 -m platformio run -d tools/espserprog
;   py -3.13 -m platformio run -d tools/espserprog -t upload --upload-port COM<n>

[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
board_build.partitions = huge_app.csv
; The live view's network comes from the environment at build time, never from a file here (J-214):
;   ESPSERPROG_SSID, ESPSERPROG_PASS. Unset = no Wi-Fi at all.
build_flags = -Wall -DSERPROG_BAUD=921600
  '-DWIFI_SSID="${sysenv.ESPSERPROG_SSID}"'
  '-DWIFI_PASS="${sysenv.ESPSERPROG_PASS}"'

; The write-capable variant, for the loose practice chip only (J-213): no opcode guard, name espserprog-rw.
;   py -3.13 -m platformio run -d tools/espserprog -e esp32-rw -t upload --upload-port COM<n>
; Flash the default (read-only) build back before the reader goes near a board.
[env:esp32-rw]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -DSERPROG_ALLOW_WRITE=1
